<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:566px;height:1130px;background:#FFFFFF;" width="566px" height="1130px" viewBox="0 0 566 1130" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="24"><text x="157.484" y="34.966" fill="#000" font-size="14" textLength="249.493" font-weight="700" font-family="'DejaVu Sans'">From Java source to a live web page</text></g><rect x="68.709" y="56.068" width="235.962" height="139.48" fill="#EAF6EA" style="stroke:#8FA8C8;stroke-width:1.5;"/><path d="M195.021,56.068 L195.021,68.136 L185.021,78.136 L68.709,78.136" style="stroke:#8FA8C8;stroke-width:1.5;" fill="none"/><text x="71.709" y="72.034" fill="#000" font-size="14" textLength="116.312" font-family="'DejaVu Sans'">Step 1 - write Java</text><rect x="78.709" y="88.136" width="215.962" height="37.706" fill="#F7F9FC" style="stroke:#4A6FA5;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="88.709" y="112.033" fill="#000" font-size="13" textLength="195.962" font-family="'DejaVu Sans'">Edit classes under src/main/java</text><rect x="91.04" y="145.842" width="191.301" height="37.706" fill="#F7F9FC" style="stroke:#4A6FA5;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="101.04" y="169.739" fill="#000" font-size="13" textLength="171.301" font-family="'DejaVu Sans'">Commit and push to GitHub</text><rect x="92.831" y="205.548" width="427.065" height="177.168" fill="#FDF0E6" style="stroke:#8FA8C8;stroke-width:1.5;"/><path d="M303.17,205.548 L303.17,217.616 L293.17,227.616 L92.831,227.616" style="stroke:#8FA8C8;stroke-width:1.5;" fill="none"/><text x="95.831" y="221.514" fill="#000" font-size="14" textLength="200.339" font-family="'DejaVu Sans'">Step 2 - build on your machine</text><path d="M274.742,237.634 L274.742,271.322 L254.742,275.322 L274.742,279.322 L274.742,313.01 A0,0 0 0 0 274.742,313.01 L509.895,313.01 A0,0 0 0 0 509.895,313.01 L509.895,247.634 L499.895,237.634 L274.742,237.634 A0,0 0 0 0 274.742,237.634" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8DC"/><path d="M499.895,237.634 L499.895,247.634 L509.895,247.634 L499.895,237.634" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8DC"/><text x="280.742" y="255.462" fill="#000" font-size="12" textLength="214.154" font-family="'DejaVu Sans'">This produces two separate programs</text><text x="280.742" y="271.806" fill="#000" font-size="12" textLength="122.317" font-family="'DejaVu Sans'">from one source tree:</text><text x="280.742" y="288.15" fill="#000" font-size="12" textLength="113.485" font-family="'DejaVu Sans'">- a normal JVM build</text><text x="280.742" y="304.494" fill="#000" font-size="12" textLength="208.993" font-family="'DejaVu Sans'">- target/teavm/ WebAssembly output</text><rect x="118.639" y="247.616" width="136.103" height="55.412" fill="#F7F9FC" style="stroke:#4A6FA5;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="128.639" y="271.513" fill="#000" font-size="13" textLength="116.103" font-family="'DejaVu Sans'">Run `mvn package`</text><text x="128.639" y="289.219" fill="#000" font-size="13" textLength="87.438" font-family="'DejaVu Sans'">(needs JDK 21)</text><rect x="102.831" y="333.01" width="167.719" height="37.706" fill="#F7F9FC" style="stroke:#4A6FA5;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="112.831" y="356.907" fill="#000" font-size="13" textLength="147.719" font-family="'DejaVu Sans'">target/teavm/ is created</text><rect x="100.215" y="392.716" width="401.788" height="152.133" fill="#FFF3CD" style="stroke:#8FA8C8;stroke-width:1.5;"/><path d="M262.618,392.716 L262.618,404.784 L252.618,414.784 L100.215,414.784" style="stroke:#8FA8C8;stroke-width:1.5;" fill="none"/><text x="103.215" y="408.682" fill="#000" font-size="14" textLength="152.403" font-family="'DejaVu Sans'">Step 3 - copy into docs/</text><path d="M283.166,424.784 L283.166,474.816 L263.166,478.816 L283.166,482.816 L283.166,532.849 A0,0 0 0 0 283.166,532.849 L492.003,532.849 A0,0 0 0 0 492.003,532.849 L492.003,434.784 L482.003,424.784 L283.166,424.784 A0,0 0 0 0 283.166,424.784" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8DC"/><path d="M482.003,424.784 L482.003,434.784 L492.003,434.784 L482.003,424.784" style="stroke:#C9A227;stroke-width:0.5;" fill="#FFF8DC"/><text x="289.166" y="442.612" fill="#000" font-size="12" textLength="131.569" font-family="'DejaVu Sans'">Only two files are really</text><text x="289.166" y="458.956" fill="#000" font-size="12" textLength="115.333" font-family="'DejaVu Sans'">needed by the page:</text><text x="289.166" y="475.3" fill="#000" font-size="12" textLength="82.933" font-family="'DejaVu Sans'">- classes.wasm</text><text x="289.166" y="491.644" fill="#000" font-size="12" textLength="144.061" font-family="'DejaVu Sans'">- classes.wasm-runtime.js</text><text x="289.166" y="507.989" fill="#000" font-size="12" textLength="187.837" font-family="'DejaVu Sans'">There is no automated copy step:</text><text x="289.166" y="524.333" fill="#000" font-size="12" textLength="171.061" font-family="'DejaVu Sans'">it is done by hand on purpose.</text><rect x="110.215" y="451.11" width="152.951" height="55.412" fill="#F7F9FC" style="stroke:#4A6FA5;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="120.215" y="475.007" fill="#000" font-size="13" textLength="132.951" font-family="'DejaVu Sans'">Copy the build output</text><text x="120.215" y="492.713" fill="#000" font-size="13" textLength="103.402" font-family="'DejaVu Sans'">into docs/teavm/</text><rect x="16" y="554.849" width="322.399" height="280.186" fill="#EAF6EA" style="stroke:#8FA8C8;stroke-width:1.5;"/><path d="M160.805,554.849 L160.805,566.917 L150.805,576.917 L16,576.917" style="stroke:#8FA8C8;stroke-width:1.5;" fill="none"/><text x="19" y="570.815" fill="#000" font-size="14" textLength="134.805" font-family="'DejaVu Sans'">Step 4 - check locally</text><rect